name: 每日台股模擬交易

on:
  schedule:
    # 台灣時間週一到週五 05:00 = UTC 週日到週四 21:00
    - cron: '0 21 * * 0-4'
  workflow_dispatch:  # 允許手動觸發

jobs:
  run-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 全市場掃描最多 30 分鐘

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: pip install yfinance pandas numpy requests

      - name: Run daily trading system
        run: python run_daily.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Commit and push results
        run: |
          git config user.name "Stock Bot"
          git config user.email "bot@github.com"
          git add index.html data/portfolio.json reports/latest_report.json
          git diff --staged --quiet || git commit -m "Daily update $(date +'%Y-%m-%d')"
          git push
